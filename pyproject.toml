[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yatraai"
version = "1.0.0"
description = "YatraAI - Context-Aware Group Travel Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "YatraAI" }]

dependencies = [
    # --- API ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.2.0",
    # --- Persistence ---
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0; platform_python_implementation == 'CPython'",
    "pgvector>=0.3.0",
    # --- Auth / security ---
    "pyjwt>=2.9.0",
    "bcrypt>=4.1",
    # --- Algorithms / science ---
    "ortools>=9.10",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pandera>=0.20",
    "pyarrow>=16.0",
    # --- HTTP ---
    "httpx>=0.27",
    # --- Observability ---
    "structlog>=24.1",
]

[project.optional-dependencies]
# Local transformer embeddings. Optional so the project installs and runs
# without a multi-GB torch download; a deterministic hashing embedder is the
# automatic fallback (see yatraai/services/rag/embeddings.py).
embeddings = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
llm = [
    "anthropic>=0.34",
    "google-generativeai>=0.7",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "freezegun>=1.5",
]

[project.scripts]
yatraai = "yatraai.cli:main"

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["yatraai*"]

[tool.setuptools.package-data]
yatraai = ["py.typed"]

# ----------------------------------------------------------------------------
# Tooling
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/web", "pipelines/airflow/logs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "N818",   # exception naming
    "RUF012", # mutable class attrs need ClassVar - noisy for SQLAlchemy/pydantic
    "RUF002", # Greek letters in docstrings are intentional (alpha, sigma in the maths)
    "RUF046", # defensive int() casts around solver values are deliberate
]

[tool.ruff.lint.isort]
known-first-party = ["yatraai", "pipelines", "ml", "evaluation"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C408", "E402"]
"pipelines/airflow/dags/*" = ["E402"]
"apps/api/alembic/*" = ["E402", "F401"]
# `X_train`/`y_test` is the universal scikit-learn convention; renaming it to satisfy
# pep8-naming would make the training code harder to read, not easier.
"ml/train_suitability.py" = ["N803", "N806"]
# Slide copy uses real typographic characters — a multiplication sign, a true minus,
# an arrow. On a projector "6 x 6" and "-57%" look wrong; RUF001 flags them only
# because they resemble ASCII, which is the point.
"scripts/build_deck.py" = ["RUF001", "RUF003"]
# Same reasoning for the generated PDFs: en dashes, true minus signs and a
# multiplication sign are correct typography in a printed document.
"scripts/build_docs_pdf.py" = ["RUF001", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live database or network service",
    "slow: long-running experiment or benchmark",
]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:pandera.*",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "apps/api"
ignore_missing_imports = true
warn_unused_ignores = false
disable_error_code = ["import-untyped"]

[tool.coverage.run]
source = ["apps/api/yatraai"]
omit = ["*/alembic/*", "*/tests/*"]
